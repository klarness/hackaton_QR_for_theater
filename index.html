<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СТИ: AR Квест</title>
    <meta name="description" content="Геймифицированный WebAR-квест во внутреннем дворике Студии театрального искусства.">
    <!-- Google model-viewer: inline 3D + native AR (ARKit / ARCore) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Камера телефона как фон страницы (запускается по тапу «Начать») -->
    <video id="camera-bg" autoplay playsinline muted></video>

    <!-- Dev controls to mock marker scanning (will be removed in prod) -->
    <div class="dev-controls" id="dev-controls">
        <!-- Buttons injected by JS -->
    </div>

    <!-- 3D Scene (model-viewer) — оптимизирован под диалог с персонажем -->
    <model-viewer
        id="ar-model"
        src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
        ios-src="https://modelviewer.dev/shared-assets/models/RobotExpressive.usdz"
        alt="3D-персонаж"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        ar-placement="floor"
        camera-controls
        disable-pan
        touch-action="pan-y"
        autoplay
        shadow-intensity="1.4"
        shadow-softness="0.8"
        exposure="1.1"
        environment-image="neutral"
        camera-target="0m 1.8m 0m"
        camera-orbit="0deg 78deg 8m"
        min-camera-orbit="-45deg 60deg 6m"
        max-camera-orbit="45deg 95deg 12m"
        field-of-view="25deg"
        interaction-prompt="none">
        <button slot="ar-button" class="ar-button" id="ar-button">
            👁 В AR
        </button>
    </model-viewer>

    <!-- Button to trigger dialogue after AR experience -->
    <button id="start-dialog-btn" class="btn-primary" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        💬 Начать диалог с персонажем
    </button>

    <!-- Intro overlay -->
    <div class="intro-overlay" id="intro-overlay">
        <h2>СТИ: AR Квест</h2>
        <p>Театральные классики оживут в дополненной реальности у вас в кармане.</p>
        <button id="start-btn" class="btn-primary">Начать</button>
    </div>

    <!-- UI Overlay that sits on top of the 3D scene -->
    <div class="ui-overlay" id="ui-overlay">
        <div class="dialogue-box" id="dialogue-box">
            <div class="character-name" id="character-name">Персонаж</div>
            <div class="dialogue-text" id="dialogue-text">Текст диалога...</div>
        </div>
        <div class="options-container" id="options-container">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
