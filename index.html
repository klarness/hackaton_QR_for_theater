<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СТИ: AR Квест</title>
    <meta name="description"
        content="Геймифицированный WebAR-квест во внутреннем дворике Студии театрального искусства.">
    <!-- AR Libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Dev controls to mock marker scanning (will be removed in prod) -->
    <div class="dev-controls" id="dev-controls">
        <!-- Buttons injected by JS -->
    </div>

    <!-- Real AR Scene (MindAR + A-Frame) -->
    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.001; filterBeta: 100000;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="characterModel1" src="./MargaritaUp2.glb"></a-asset-item>
            <a-asset-item id="characterModel2" src="./cube.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
            raycaster="far: 10000; objects: .clickable"></a-camera>

        <!-- Our Target (Bank Card) -->
        <a-entity id="target-marker1" data-marker-id="marker1" mindar-image-target="targetIndex: 0">
            <a-gltf-model class="character-model" src="#characterModel1" position="0 0 0" scale="3 3 3"
                rotation="90 0 0" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
        </a-entity>

        <!-- targetIndex: 1 заработает после объединения 21lab2.mind и begemot.mind в один .mind файл -->
        <a-entity id="target-marker2" data-marker-id="marker2" mindar-image-target="targetIndex: 1">
            <a-gltf-model class="character-model" src="#characterModel2" position="0 0 0" scale="0.02 0.02 0.02"
                rotation="0 0 0" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
        </a-entity>
    </a-scene>

    <!-- Tracking hint for the user -->
    <div class="tracking-hint" id="tracking-hint">
        <span class="icon">🎯</span> Держите камеру на маркере
    </div>

    <!-- Intro overlay to request camera permissions -->
    <div class="intro-overlay" id="intro-overlay">
        <h2>СТИ: AR Квест</h2>
        <p>Для прохождения квеста необходим доступ к камере вашего устройства.</p>
        <button id="start-btn" class="btn-primary">Разрешить доступ и начать</button>
    </div>

    <!-- UI Overlay that sits on top of AR -->
    <div class="ui-overlay" id="ui-overlay">
        <div class="dialogue-box" id="dialogue-box">
            <div class="character-name" id="character-name">Персонаж</div>
            <div class="dialogue-text" id="dialogue-text">Текст диалога...</div>
        </div>
        <div class="options-container" id="options-container">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
