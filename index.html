<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СТИ: AR Квест</title>
    <meta name="description" content="Геймифицированный WebAR-квест во внутреннем дворике Студии театрального искусства.">
    <!-- Google model-viewer: inline 3D + native AR (ARKit / ARCore) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dev controls to mock marker scanning (will be removed in prod) -->
    <div class="dev-controls" id="dev-controls">
        <!-- Buttons injected by JS -->
    </div>

    <!-- 3D / AR Scene (model-viewer) -->
    <model-viewer
        id="ar-model"
        src="./cube.glb"
        alt="AR-персонаж"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        ar-placement="floor"
        camera-controls
        touch-action="pan-y"
        autoplay
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        camera-orbit="0deg 80deg 2.5m"
        field-of-view="35deg"
        interaction-prompt="none">
        <button slot="ar-button" class="ar-button" id="ar-button">
            👁 Посмотреть в моём пространстве
        </button>
    </model-viewer>

    <!-- Intro overlay -->
    <div class="intro-overlay" id="intro-overlay">
        <h2>СТИ: AR Квест</h2>
        <p>Театральные классики оживут в дополненной реальности у вас в кармане.</p>
        <button id="start-btn" class="btn-primary">Начать</button>
    </div>

    <!-- UI Overlay that sits on top of the 3D scene -->
    <div class="ui-overlay" id="ui-overlay">
        <div class="dialogue-box" id="dialogue-box">
            <div class="character-name" id="character-name">Персонаж</div>
            <div class="dialogue-text" id="dialogue-text">Текст диалога...</div>
        </div>
        <div class="options-container" id="options-container">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
